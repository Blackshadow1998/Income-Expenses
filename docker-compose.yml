services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: income-expenses-api
    ports:
      # Only this PC can reach port 8080; phones use HTTPS via `tailscale serve --bg 8080`.
      - "127.0.0.1:8080:8080"
    environment:
      BACKUP_DIR: /app/backups # daily copy of the DB, newest 30 kept
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-} # set in .env (repo root) to turn on Google sign-in
    volumes:
      - income_expenses_data:/app/data
      # Daily DB copies + slip images on the PC's disk, outside the Docker volume. Set BACKUP_HOST_DIR in
      # .env to a cloud-synced folder (e.g. OneDrive) for an off-machine copy; default is ./backups/auto.
      - ${BACKUP_HOST_DIR:-./backups/auto}:/app/backups
    restart: unless-stopped

volumes:
  income_expenses_data:
